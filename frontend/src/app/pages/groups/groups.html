<div class="page-container fade-in">
  <div class="page-header">
    <div class="header-content">
      <mat-icon class="header-icon text-primary">groups</mat-icon>
      <div>
        <h1>Gestión de Grupos</h1>
        <p class="subtitle">Administra los grupos de seguridad del Directorio Activo.</p>
      </div>
    </div>
    <button mat-flat-button color="primary" class="create-btn" (click)="createGroupDummy()">
      <mat-icon>add</mat-icon>
      Nuevo Grupo
    </button>
  </div>

  <div class="table-container glass-card">
    @if (loading) {
      <div class="loading-overlay">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    }

    <table mat-table [dataSource]="groups" class="full-width-table">
      
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Nombre del Grupo </th>
        <td mat-cell *matCellDef="let group"> 
          <div class="td-icon-text">
            <mat-icon class="text-primary">group</mat-icon>
            <strong>{{ getGroupValue(group, 'sAMAccountName') }}</strong>
          </div>
        </td>
      </ng-container>

      <!-- Description Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Descripción </th>
        <td mat-cell *matCellDef="let group" class="text-secondary"> 
          {{ getGroupValue(group, 'description') || 'Sin descripción' }}
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-right"> Acciones </th>
        <td mat-cell *matCellDef="let group" class="text-right">
          <button mat-icon-button color="warn" (click)="deleteGroup(getGroupValue(group, 'sAMAccountName'))" title="Eliminar Grupo">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover-row"></tr>
      
      <!-- Fila si no hay datos -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-cell" colspan="3">
          No se encontraron grupos en el directorio.
        </td>
      </tr>
    </table>
  </div>
</div>
